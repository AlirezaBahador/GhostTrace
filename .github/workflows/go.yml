name: GhostTrace build and quality checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  go:
    name: Go, API, eBPF build (no privileged kernel test)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Install BPF and shell tools
        run: sudo apt-get update && sudo apt-get install -y clang llvm linux-libc-dev shellcheck
      - name: Dependency checks (fail on unresolved or uncommitted modules)
        run: |
          test -s go.sum
          go mod download
          go mod verify
          go mod tidy -diff
      - name: Go formatting
        run: test -z "$(gofmt -l cmd internal pkg)"
      - name: Go vet
        run: go vet ./...
      - name: Go unit tests
        run: go test -count=1 ./...
      - name: Race tests
        run: go test -race -count=1 ./...
      - name: Build CLI, agent and BPF
        run: make analyze query server build CLANG=/usr/bin/clang
      - name: Inspect eBPF ELF and agent binary
        run: |
          file build/process.bpf.o build/ghosttrace-agent
          llvm-readelf -h build/process.bpf.o | grep -E 'Machine:.*Linux BPF'
          file build/ghosttrace-agent | grep 'ELF'
      - name: Validate rule files and replay empty stream
        run: ./build/ghosttrace-analyze -rules rules -input /dev/null
      - name: Verify server refuses unauthenticated startup
        run: |
          if ./build/ghosttrace-server -events /dev/null; then
            echo 'insecure server startup unexpectedly succeeded' >&2
            exit 1
          fi
      - name: Unprivileged localhost API integration
        run: bash tests/integration/api.sh
      - name: Shell syntax and shellcheck
        run: |
          find tests/integration -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
          shellcheck tests/integration/*.sh
      # Privileged BPF loading / tracepoint verification requires a dedicated VM.
  dashboard:
    name: Dashboard reproducible build
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: dashboard/package-lock.json
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: TypeScript check
        run: npx tsc -p tsconfig.json --noEmit
      - name: Production build
        run: npm run build
  security:
    name: Go vulnerability scan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: golang/govulncheck-action@v1
        with:
          go-version-file: go.mod
          cache: false
          repo-checkout: false
