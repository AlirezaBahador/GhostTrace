# TEMPORARY workflow for this audit branch only. Remove once reviewed lockfiles
# are committed; never leave unattended self-mutating workflow on main.
name: Bootstrap dependency locks (temporary audit branch)
on:
  push:
    branches:
      - audit/p0-build-reproducibility
permissions:
  contents: write
jobs:
  lock:
    if: github.repository == 'AlirezaBahador/GhostTrace'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate Go checksums from registry
        run: go mod tidy && go mod download && go mod verify
      - name: Generate npm lockfile from registry
        working-directory: dashboard
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Commit generated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          test -s go.sum
          test -s dashboard/package-lock.json
          git add go.mod go.sum dashboard/package-lock.json
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
              commit -m 'build: lock Go and npm dependencies'
            git push origin HEAD:audit/p0-build-reproducibility
          fi
